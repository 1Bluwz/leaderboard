    <style>
        :root {
            --bg-deep: #070a12;
            --bg-body: #0d111a;
            --accent: #ff4d4d;
            --border: #1f283d;
        }
        body { background-color: var(--bg-body); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* ── NAVBAR ─────────────────────────────────────────── */
        .zt-nav { background: #0a0d16; border-bottom: 1px solid var(--border); }
        .zt-logo-emblem { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,77,77,0.35); }
        .zt-navlink {
            display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
            color: #8b93a7; padding: 6px 10px; border-radius: 6px; transition: color .15s ease, background-color .15s ease;
        }
        .zt-navlink:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .zt-navlink.active { color: #fff; }
        .zt-search {
            background: #131926; border: 1px solid var(--border); border-radius: 8px;
            padding: 7px 12px; font-size: 12px; color: #cbd2e1; width: 190px;
        }
        .zt-search::placeholder { color: #5b6478; }
        .zt-search:focus { outline: none; border-color: var(--accent); }

        /* ── TABS DE MODALIDAD ──────────────────────────────── */
        .mode-tab {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 10px 6px 8px; font-size: 11px; font-weight: 800; letter-spacing: .02em;
            color: #5b6478; border-bottom: 2px solid transparent; transition: color .15s ease, border-color .15s ease;
        }
        .mode-tab.active { color: #fff; border-color: var(--accent); }
        .mode-tab:hover:not(.active) { color: #9aa3b8; }

        /* ── TARJETA DE JUGADOR ─────────────────────────────── */
        .player-card {
            background: linear-gradient(90deg, #111723 0%, #0f1420 100%);
            border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
            transition: border-color 0.2s ease, transform 0.2s ease;
            position: relative; overflow: hidden; min-height: 72px;
        }
        .player-card:hover, .player-card:focus-visible { border-color: var(--accent); transform: translateX(4px); }
        .player-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .rank-badge-zone {
            height: 100%; width: 135px; flex-shrink: 0; display: flex; align-items: center; padding-left: 15px;
            position: relative; z-index: 2; clip-path: polygon(0 0, 85% 0, 65% 100%, 0% 100%);
        }
        .bg-top1 { background: linear-gradient(135deg, #e0a910 0%, #8c6603 100%); }
        .bg-top2 { background: linear-gradient(135deg, #a1a8b8 0%, #5d6370 100%); }
        .bg-top3 { background: linear-gradient(135deg, #cc6925 0%, #783a11 100%); }
        .bg-normal-rank { background: linear-gradient(135deg, #1b2436 0%, #131a26 100%); border-right: 2px solid #2d364d; }
        .rank-num-text { font-size: 1.5rem; font-weight: 900; font-style: italic; letter-spacing: -1px; }
        .medal-icon { position: absolute; top: -4px; left: 24px; font-size: 14px; z-index: 3; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

        .avatar-inside-rank { height: 100%; width: 55px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
        .avatar-inside-rank img { height: 115%; object-fit: contain; transform: translateY(8px); }

        .player-name { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .podium-glow::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transform: skewX(-25deg); animation: sweepGlow 5s infinite ease-in-out;
        }
        @keyframes sweepGlow { 0% { left: -150%; } 12% { left: 150%; } 100% { left: 150%; } }
        @media (prefers-reduced-motion: reduce) {
            .podium-glow::after { animation: none; }
            .player-card { transition: none; }
        }

        /* ── REGIÓN ─────────────────────────────────────────── */
        .region-chip {
            font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 5px;
            letter-spacing: .03em; flex-shrink: 0;
        }

        /* ── CHIPS DE TIER (estilo mctiers: ícono + código) ─── */
        .tier-chip {
            display: flex; align-items: center; gap: 5px; padding: 3px 8px 3px 3px;
            border-radius: 999px; background: #131a26; border: 1px solid #253247; flex-shrink: 0;
        }
        .tier-chip .icon-circle {
            width: 22px; height: 22px; border-radius: 50%; background: #0d1420;
            display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; font-size: 11px;
        }
        .tier-chip .icon-circle img { width: 68%; height: 68%; object-fit: contain; }
        .tier-chip .code { font-size: 10px; font-weight: 900; letter-spacing: .02em; }

        .tier-z .code { color: #ffcc00; } .tier-z { border-color: rgba(255,204,0,0.5); }
        .tier-s .code { color: #ffaa00; } .tier-s { border-color: rgba(255,170,0,0.4); }
        .tier-a-plus .code { color: #ff5555; } .tier-a-plus { border-color: rgba(255,85,85,0.4); }
        .tier-a-minus .code { color: #a78bfa; } .tier-a-minus { border-color: rgba(167,139,250,0.4); }
        .tier-b-plus .code { color: #38bdf8; } .tier-b-plus { border-color: rgba(56,189,248,0.4); }
        .tier-b .code { color: #94a3b8; } .tier-b { border-color: rgba(148,163,184,0.3); }
        .tier-none .code { color: #4b5563; }

        .modal-position-box {
            background: #171f30; border: 1px solid #25314a; border-radius: 6px;
            display: flex; align-items: center; overflow: hidden; height: 44px; margin-bottom: 8px;
        }
        .modal-position-left {
            height: 100%; width: 90px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; font-weight: 900; font-style: italic;
            clip-path: polygon(0 0, 100% 0, 78% 100%, 0% 100%);
        }

        #player-modal, #credits-modal {
            display: none; position: fixed; inset: 0; background: rgba(5,7,12,0.94);
            z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .modal-content {
            background: #0f1422; border: 1px solid #25314a; width: 95%; max-width: 430px;
            padding: 24px; border-radius: 16px; position: relative; max-height: 90vh; overflow-y: auto;
        }
        .modal-content::-webkit-scrollbar { width: 0px; background: transparent; }

        button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        @media (max-width: 480px) {
            .rank-badge-zone { width: 108px; padding-left: 10px; }
            .avatar-inside-rank { width: 46px; }
            .player-name { max-width: 26vw; }
            .zt-search { display: none; }
        }
    </style>
</head>

                <button onclick="changeMode('general')" id="btn-general" class="mode-tab active"><span>🌍</span>General</button>
                <button onclick="changeMode('bedfight')" id="btn-bedfight" class="mode-tab"><span>⚔️</span>Bedfight</button>
                <button onclick="changeMode('ranked')" id="btn-ranked" class="mode-tab"><span>🏅</span>Ranked BW</button>
                <button onclick="changeMode('bedwars')" id="btn-bedwars" class="mode-tab"><span>🛏️</span>Bedwars</button>
            </div>
        </div>

        <div id="leaderboard" class="space-y-2.5"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlfD0FvQ-kVK2leat4n9qOvfu3zJ8rlv-B8qm9434NOMGCV4pOyw7B-cchbzFCpKCVSOGFhCI0YST_/pub?gid=0&single=true&output=csv';
        const DISCORD_INVITE = "https://discord.gg/zteamz";

        const LOGO_TIKTOK = "https://i.ibb.co/VWTg69wG/tiktok.png";
        const LOGO_INSTAGRAM = "https://i.ibb.co/6R4ZgpyQ/instagram.png";
        const LOGO_BEDFIGHT = "https://i.ibb.co/M5yGmfXd/bedfight.png";
        const LOGO_BEDWARS = "https://i.ibb.co/YFrcLPKp/bedwars.png";
        const LOGO_RBW = "https://i.ibb.co/v4S8Q3W/ender_icon.png";

        let globalPlayersData = [];
        let currentMode = 'general';
        let searchTerm = '';

        function getTierStyleClass(tier) {
            if (!tier) return "tier-none";
            const t = tier.trim().toUpperCase();
            switch (t) {
                case "Z": return "tier-z";
                case "S+": return "tier-z";
                case "S": return "tier-s";
                case "A+": return "tier-a-plus";
                case "A-": return "tier-a-minus";
                case "B+": return "tier-b-plus";
                case "B": return "tier-b";
                default: return "tier-none";
            }
        }

        const REGION_STYLES = {
            NA: ["#3f1d1d", "#ff8080"], EU: ["#173a20", "#4ade80"], LATAM: ["#3f2f10", "#fbbf24"],
            AS: ["#16233a", "#60a5fa"], OCE: ["#2a1d3f", "#c084fc"], SA: ["#3f2010", "#fb923c"],
            AF: ["#0f2f28", "#2dd4bf"],
        };
        function regionChipHTML(region) {
            const r = (region || "").trim().toUpperCase();
            const [bg, fg] = REGION_STYLES[r] || ["#1f2937", "#9ca3af"];
            return `<span class="region-chip" style="background:${bg};color:${fg}">${r || "—"}</span>`;
        }

        function changeMode(mode) {
            currentMode = mode;
            ['general', 'bedfight', 'ranked', 'bedwars'].forEach(m => {
                document.getElementById(`btn-${m}`).classList.toggle('active', m === mode);
            });
            renderLeaderboard();
        }

        function onSearchInput(value) {
            searchTerm = value.trim().toLowerCase();
            renderLeaderboard();
        }

        function openCredits() { document.getElementById('credits-modal').style.display = 'flex'; }
        function closeCredits() { document.getElementById('credits-modal').style.display = 'none'; }

        function loadData() {
            Papa.parse(CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    globalPlayersData = results.data.map(row => {
                        let normalizedRow = {};
                        for (let key in row) {
                            let cleanKey = key.trim().toLowerCase().replace(/[\s_]/g, '');
                            normalizedRow[cleanKey] = row[key];
                        }
                        return normalizedRow;
                    }).filter(r => r.uuid);
                    renderLeaderboard();
                }
            });
        }

        function getRankOfPlayer(playerUUID, mode) {
            let list = globalPlayersData.map(p => {
                let pts = 0;
                if (mode === 'general') pts = parseInt(p.bedfightpuntos || 0) + parseInt(p.rankedpuntos || 0) + parseInt(p.bedwarspuntos || 0);
                else if (mode === 'bedfight') pts = parseInt(p.bedfightpuntos || 0);
                else if (mode === 'ranked') pts = parseInt(p.rankedpuntos || 0);
                else if (mode === 'bedwars') pts = parseInt(p.bedwarspuntos || 0);
                return { uuid: p.uuid, pts: isNaN(pts) ? 0 : pts };
            });
            list.sort((a, b) => b.pts - a.pts);
            let position = list.findIndex(item => item.uuid === playerUUID) + 1;
            return position > 0 ? position : "-";
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';

            if (globalPlayersData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-14 border border-dashed border-gray-800 rounded-lg">
                        <p class="text-gray-500 text-sm font-bold">Todavía no hay jugadores en la tierlist.</p>
                    </div>`;
                return;
            }

            let sortedPlayers = globalPlayersData.map(p => {
                let bfPts = parseInt(p.bedfightpuntos || 0);
                let rkPts = parseInt(p.rankedpuntos || 0);
                let bwPts = parseInt(p.bedwarspuntos || 0);
                if (isNaN(bfPts)) bfPts = 0;
                if (isNaN(rkPts)) rkPts = 0;
                if (isNaN(bwPts)) bwPts = 0;

                let totalPts = bfPts + rkPts + bwPts;
                let targetPts = totalPts;
                let targetTier = p.tier || "-";

                if (currentMode === 'bedfight') { targetPts = bfPts; targetTier = p.bedfighttier || "-"; }
                else if (currentMode === 'ranked') { targetPts = rkPts; targetTier = p.rankedtier || "-"; }
                else if (currentMode === 'bedwars') { targetPts = bwPts; targetTier = p.bedwarstier || "-"; }

                return { ...p, bfPts, rkPts, bwPts, totalPts, targetPts, targetTier };
            });

            if (searchTerm) {
                sortedPlayers = sortedPlayers.filter(p => (p.jugador || "").toLowerCase().includes(searchTerm));
            }

            sortedPlayers.sort((a, b) => b.targetPts - a.targetPts);

            if (sortedPlayers.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-14 border border-dashed border-gray-800 rounded-lg">
                        <p class="text-gray-500 text-sm font-bold">No encontré ningún jugador con ese nombre.</p>
                    </div>`;
                return;
            }

            sortedPlayers.forEach((p, index) => {
                let rank = index + 1;
                let cleanUUID = p.uuid.replace(/-/g, "").trim();

                let rankZoneClass = "bg-normal-rank";
                let podiumCardClass = "";
                let medal = "";
                if (rank === 1) { rankZoneClass = "bg-top1"; podiumCardClass = "podium-glow border-yellow-600/50"; medal = "🥇"; }
                else if (rank === 2) { rankZoneClass = "bg-top2"; podiumCardClass = "podium-glow border-slate-500/50"; medal = "🥈"; }
                else if (rank === 3) { rankZoneClass = "bg-top3"; podiumCardClass = "podium-glow border-amber-800/50"; medal = "🥉"; }

                let rankNumColor = rank <= 3 ? "text-white" : "text-gray-400";
                let pString = encodeURIComponent(JSON.stringify(p));

                let rankTitle = "Combat Ace";
                if (p.targetPts >= 250) rankTitle = "Combat Master";
                if (p.targetPts >= 500) rankTitle = "Combat Sorcerer";

                let classGen = getTierStyleClass(p.tier);
                let classBf = getTierStyleClass(p.bedfighttier);
                let classRk = getTierStyleClass(p.rankedtier);
                let classBw = getTierStyleClass(p.bedwarstier);

                let labelGen = (p.tier && p.tier.trim() !== "") ? p.tier : "-";
                let labelBf = (p.bedfighttier && p.bedfighttier.trim() !== "") ? p.bedfighttier : "-";
                let labelRk = (p.rankedtier && p.rankedtier.trim() !== "") ? p.rankedtier : "-";
                let labelBw = (p.bedwarstier && p.bedwarstier.trim() !== "") ? p.bedwarstier : "-";

                container.innerHTML += `
                    <div class="player-card ${podiumCardClass}" role="button" tabindex="0"
                         onclick="openModal('${pString}', '${cleanUUID}', '${rankTitle}')"
                         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openModal('${pString}', '${cleanUUID}', '${rankTitle}')}">
                        <div class="flex items-center h-full">
                            <div class="rank-badge-zone ${rankZoneClass}">
                                ${medal ? `<span class="medal-icon">${medal}</span>` : ""}
                                <span class="rank-num-text ${rankNumColor}">${rank}</span>
                                <div class="avatar-inside-rank">
                                    <img src="https://visage.surgeplay.com/bust/96/${cleanUUID}" onerror="this.src='https://visage.surgeplay.com/bust/96/steve'" alt="">
                                </div>
                            </div>

                            <div class="ml-4 min-w-0">
                                <div class="player-name font-black uppercase italic text-sm text-gray-100">${p.jugador}</div>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    <span class="text-[9px] text-gray-400 font-bold uppercase">${rankTitle}</span>
                                    <span class="text-[9px] text-gray-600 font-bold">•</span>
                                    <span class="text-[9px] text-[#ff4d4d] font-black uppercase">${p.targetPts} PTS</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 pr-4 flex-shrink-0">
                            ${regionChipHTML(p.region)}
                            <div class="tier-chip ${classGen}">
                                <div class="icon-circle">🏆</div>
                                <span class="code">${labelGen}</span>
                            </div>
                            <div class="tier-chip ${classBf}">
                                <div class="icon-circle"><img src="${LOGO_BEDFIGHT}" alt=""></div>
                                <span class="code">${labelBf}</span>
                            </div>
                            <div class="tier-chip ${classRk}">
                                <div class="icon-circle"><img src="${LOGO_RBW}" alt=""></div>
                                <span class="code">${labelRk}</span>
                            </div>
                            <div class="tier-chip ${classBw}">
                                <div class="icon-circle"><img src="${LOGO_BEDWARS}" alt=""></div>
                                <span class="code">${labelBw}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(playerDataStr, cleanUUID, rankTitle) {
            const p = JSON.parse(decodeURIComponent(playerDataStr));

            document.getElementById('m-name').innerText = p.jugador;
            document.getElementById('m-img').src = `https://visage.surgeplay.com/bust/128/${cleanUUID}`;
            document.getElementById('m-region').innerText = `Region: ${p.region || 'EU'}`;
            document.getElementById('m-rank').innerText = `⭐ ${rankTitle}`;

            let posGen = getRankOfPlayer(p.uuid, 'general');
            let posBf = getRankOfPlayer(p.uuid, 'bedfight');
            let posRk = getRankOfPlayer(p.uuid, 'ranked');
            let posBw = getRankOfPlayer(p.uuid, 'bedwars');

            document.getElementById('m-pos-gen').innerText = `${posGen}.`;
            document.getElementById('m-pos-bf').innerText = `${posBf}.`;
            document.getElementById('m-pos-rk').innerText = `${posRk}.`;
            document.getElementById('m-pos-bw').innerText = `${posBw}.`;

            let tierGenLabel = (p.tier && p.tier.trim() !== "") ? p.tier : "-";
            let tierBfLabel = (p.bedfighttier && p.bedfighttier.trim() !== "") ? p.bedfighttier : "-";
            let tierRkLabel = (p.rankedtier && p.rankedtier.trim() !== "") ? p.rankedtier : "-";
            let tierBwLabel = (p.bedwarstier && p.bedwarstier.trim() !== "") ? p.bedwarstier : "-";

            document.getElementById('m-elo-gen').innerText = `${tierGenLabel} (${p.totalPts || 0} points)`;
            document.getElementById('m-elo-bf').innerText = `${tierBfLabel} (${p.bfPts || 0} points)`;
            document.getElementById('m-elo-rk').innerText = `${tierRkLabel} (${p.rkPts || 0} points)`;
            document.getElementById('m-elo-bw').innerText = `${tierBwLabel} (${p.bwPts || 0} points)`;

            const boxGen = document.getElementById('m-box-bg-gen');
            if (posGen == 1) boxGen.className = "modal-position-left text-black bg-[#e0a910]";
            else if (posGen == 2) boxGen.className = "modal-position-left text-black bg-[#a1a8b8]";
            else if (posGen == 3) boxGen.className = "modal-position-left text-white bg-[#cc6925]";
            else boxGen.className = "modal-position-left text-gray-300 bg-[#1f293d]";

            const redesContainer = document.getElementById('redes-container');
            redesContainer.innerHTML = '';
            let contadorRedes = 0;

            const crearEnlaceRed = (url, plataforma, iconUrl) => {
                if (url && url.trim() !== "") {
                    contadorRedes++;
                    return `
                        <a href="${url.trim()}" target="_blank" class="bg-[#171f30] hover:bg-[#1e2940] border border-gray-800 text-gray-300 text-[10px] font-bold py-2 px-1 rounded flex items-center justify-center gap-1.5 transition block truncate">
                            <img src="${iconUrl}" class="w-3.5 h-3.5 object-contain" alt=""> ${plataforma}
                        </a>`;
                }
                return '';
            };

            redesContainer.innerHTML += crearEnlaceRed(p.redes, 'YouTube', 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png');
            redesContainer.innerHTML += crearEnlaceRed(p.tiktok, 'TikTok', LOGO_TIKTOK);
            redesContainer.innerHTML += crearEnlaceRed(p.instagram, 'Instagram', LOGO_INSTAGRAM);

            if (contadorRedes === 0) {
                redesContainer.className = "block text-center";
                redesContainer.innerHTML = `
                    <a href="${DISCORD_INVITE}" target="_blank" class="bg-[#1f293d] border border-dashed border-gray-700 hover:border-gray-500 text-gray-400 text-[11px] font-black py-2.5 px-4 rounded w-full block transition uppercase tracking-wider">
                         💬 Agregar en Discord
                    </a>
                `;
            } else {
                redesContainer.className = `grid grid-cols-${contadorRedes > 1 ? 2 : 1} gap-2`;
            }

            document.getElementById('player-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('player-modal').style.display = 'none'; }
        window.onload = loadData;
    </script>
</body>
</html>
